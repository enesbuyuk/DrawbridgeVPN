[package]
name = "drawbridgevpn"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "drawbridge_vpn"
path = "src/lib.rs"

[[bin]]
name = "drawbridgevpn"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
block2 = "0.6.2"
chromiumoxide = "0.9.1"
dirs = "6.0.0"
dispatch2 = "0.3.1"
eframe = "0.35.0"
egui = "0.35.0"
egui_extras = { version = "0.35", features = ["image"] }
futures = "0.3.33"
keyring = "4.1.5"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSWindow", "NSView", "NSGraphics", "NSResponder"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSURL", "NSURLRequest", "NSHTTPCookie", "NSArray", "NSError", "NSGeometry"] }
objc2-web-kit = { version = "0.3.2", features = ["WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKHTTPCookieStore", "WKNavigation", "WKContentRuleList", "WKContentRuleListStore", "WKUserContentController", "block2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "process", "macros", "sync"] }
totp-rs = "5.7.2"
uuid = { version = "1.24.0", features = ["v4"] }
